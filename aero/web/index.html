<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aero CFD</title>
<style>
:root{
  color-scheme: light;
  --ground:#F3EDDC; --surface:#FDFBF2; --panel:#F9F5EA; --sunk:#E8E1CC;
  --ink:#1F2D21; --muted:#55634F; --faint:#6E7A66;
  --accent:#15803D; --accent-deep:#14653A; --accent-soft:#DFEFE3;
  --line:#CBBF9E; --line-soft:#DED5BC;
  --warn:#8A5A0B; --error:#B3261E;
  --cd:#127A38; --cl:#5B21B6;
  --tunnel:#30123b;
  --top:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:16px}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
button{font:inherit;cursor:pointer}

.topbar{
  height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.topbar .sp{flex:1 1 auto}
.pill{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:20px;padding:3px 11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 14px;font-weight:550}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-deep)}
.btn.danger{color:var(--error)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:500}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100% - var(--top))}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 16px 20px;overflow-y:auto}
.main{display:grid;grid-template-rows:auto minmax(0,1.35fr) minmax(0,1fr);gap:10px;padding:10px 14px 12px;min-height:0}

fieldset{border:none;margin:0 0 12px;padding:0}
fieldset h2{margin-bottom:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.one{grid-template-columns:1fr}
label{display:block;font-size:11px;color:var(--faint);margin-bottom:2px;letter-spacing:.02em}
input,select{width:100%;font:inherit;font-size:13px;padding:5px 8px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:7px}
.check input{width:auto}
.hint{font-size:11.5px;color:var(--faint);margin:2px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;min-height:0;display:flex;flex-direction:column}
.card h2{margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.toprow{display:flex;flex-direction:row;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 14px}
.status{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);min-width:0;flex:1 1 260px}
.status span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.running{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.dot.done{background:var(--accent)} .dot.error{background:var(--error)} .dot.stopped{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.running{animation:none}}
.bar{height:4px;background:var(--sunk);border-radius:3px;overflow:hidden;flex:0 0 100%;margin-top:-2px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.stat .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:400;color:var(--muted)}
.checks{flex:0 0 100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line-soft);border-radius:12px;padding:2px 9px;cursor:help;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.chip.pass i{background:var(--accent)} .chip.warn i{background:var(--warn)} .chip.fail i{background:var(--error)}
.chip.ref{color:var(--ink);font-weight:550}
.err{background:#FBEAE8;border:1px solid #E4B9B4;color:var(--error);border-radius:6px;padding:6px 10px;font-size:13px;flex:0 0 100%}

.midrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;min-height:0}
.botrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
.fill{flex:1;min-height:0;position:relative}
.viewer{background:var(--tunnel);border-radius:7px;overflow:hidden;position:relative}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.viewer .legend{position:absolute;left:10px;bottom:8px;font-size:11px;color:#c9bcd9;display:flex;align-items:center;gap:6px;pointer-events:none}
.viewer .legend i{display:inline-block;width:96px;height:6px;border-radius:3px}
.viewer .legend .hint{margin-left:10px;color:#9d8fb3}
.viewer .empty{position:absolute;inset:0;display:grid;place-items:center;color:#9d8fb3;font-size:13px;pointer-events:none}
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:6px 0 0 6px}
.seg .btn + .btn{margin-left:-1px}
.seg .btn:last-child{border-radius:0 6px 6px 0}
.seg .btn.on{background:var(--accent);border-color:var(--accent);color:#fff;position:relative}
svg.chart{display:block;width:100%;height:100%}
figure{margin:0;flex:1;min-height:0;background:#fff;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden;display:grid;place-items:center}
figure img{width:100%;height:100%;object-fit:contain;display:block}
figure .empty{color:var(--faint);font-size:12.5px}
@media (max-width:900px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;height:auto}
  .main{grid-template-rows:auto 520px 300px}
  .midrow{grid-template-columns:1fr}
  .botrow{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Aero CFD</h1>
  <span class="pill mono" id="setupPill">no run yet</span>
  <span class="sp"></span>
  <button class="btn primary" id="runBtn">Run</button>
  <button class="btn danger" id="stopBtn" disabled>Stop</button>
</div>

<div class="layout">
  <aside class="side">
    <fieldset>
      <h2>Case</h2>
      <div class="row">
        <div><label for="mode">Mode</label>
          <select id="mode"><option value="2d">2D</option><option value="3d">3D</option></select></div>
        <div><label for="shape">Shape</label><select id="shape"></select></div>
      </div>
      <div class="row" id="dimRow"></div>
      <div class="row">
        <div><label for="re">Reynolds number</label><input id="re" type="number" value="100" min="0.1" step="10"></div>
        <div><label for="u0">Inlet u₀</label><input id="u0" type="number" value="0.05" min="0.001" max="0.2" step="0.01"></div>
      </div>
      <div class="row three" id="gridRow"></div>
      <div class="row one">
        <div><label for="steps">Steps</label><input id="steps" type="number" value="3000" min="50" step="500"></div>
      </div>
    </fieldset>
    <fieldset>
      <h2>Solver</h2>
      <div class="row">
        <div><label for="collision">Collision</label><select id="collision"></select></div>
        <div><label for="backend">Backend</label><select id="backend"></select></div>
      </div>
      <div class="row" id="latticeRow" hidden>
        <div><label for="lattice">Lattice</label><select id="lattice"></select></div><div></div>
      </div>
      <div class="row">
        <div><label for="wall_bc">Wall BC</label><select id="wall_bc"></select></div>
        <div><label for="outlet_bc">Outlet BC</label><select id="outlet_bc"></select></div>
      </div>
      <div class="check"><input type="checkbox" id="les"><label for="les" style="margin:0">Smagorinsky LES</label></div>
      <div class="row one">
        <div><label for="inlet_perturbation">Inlet perturbation (fraction of u₀)</label>
          <input id="inlet_perturbation" type="number" value="0.02" min="0" max="0.5" step="0.01"></div>
      </div>
      <p class="hint" id="pertHint">A small perturbation is what trips vortex shedding above Re ≈ 47.</p>
    </fieldset>
  </aside>

  <main class="main">
    <div class="card toprow">
      <div class="status"><span class="dot" id="dot"></span><span class="t" id="statusText">Set a case and press Run.</span></div>
      <div class="stats" id="stats"></div>
      <span class="mono" id="elapsed" style="font-size:12px;color:var(--muted)"></span>
      <div class="bar"><i id="bar"></i></div>
      <div class="checks" id="checks" hidden></div>
      <div id="errBox" hidden class="err"></div>
    </div>

    <div class="midrow">
      <div class="card">
        <h2>Wind tunnel <span class="sp"></span>
          <span class="seg" id="qtySeg" role="group" aria-label="Quantity shown">
            <button class="btn sm on" data-q="smoke" title="Dye released upstream and carried through the computed velocity field, coloured by speed">Smoke</button>
            <button class="btn sm" data-q="wake" title="How much the body disturbs the flow, |u − U∞|: clear in the free stream, a plume in the wake">Wake</button>
            <button class="btn sm" data-q="vorticity" title="How fast the flow spins, |∇×u|: boundary layers, shear layers and vortices">Vorticity</button>
          </span>
          <button class="btn sm" id="animBtn" title="Freeze or resume the smoke">Pause</button>
          <button class="btn sm" id="resetBtn">Reset view</button></h2>
        <div class="fill viewer">
          <canvas id="tunnel"></canvas>
          <div class="empty" id="tunnelEmpty">The flow appears once a run starts</div>
          <div class="legend"><span id="lgName">speed |u|</span><span>0</span><i id="lgBar"></i><span id="lgHi">high</span><span class="hint">drag to rotate · wheel to zoom</span></div>
        </div>
      </div>
      <div class="card">
        <h2>Convergence <span class="sp"></span>
          <span style="font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0">
            <i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cd);vertical-align:-1px"></i> C<sub>d</sub>&nbsp;&nbsp;
            <i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cl);vertical-align:-1px"></i> C<sub>l</sub></span></h2>
        <div class="fill"><svg class="chart" id="chart" role="img" aria-label="Drag and lift coefficient against step"></svg></div>
      </div>
    </div>

    <div class="botrow">
      <div class="card"><h2>Velocity</h2><figure id="fig_speed"><span class="empty">—</span></figure></div>
      <div class="card"><h2>Vorticity</h2><figure id="fig_vorticity"><span class="empty">—</span></figure></div>
      <div class="card"><h2>Pressure</h2><figure id="fig_pressure"><span class="empty">—</span></figure></div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let schema = null, jobId = null, poll = null;
let lastState = "", figStamp = -1, fieldStamp = -1, formSynced = false, geomLoaded = false;

// ---------------------------------------------------------------- form ----
const DIMS = {
  "2d:cylinder":  [["radius","Radius",20]],
  "2d:rectangle": [["width","Width",40],["height","Height",20]],
  "3d:sphere":    [["radius","Radius",7]],
  "3d:box":       [["width","Width",10],["height","Height",10],["depth","Depth",10]],
  "3d:cylinder":  [["radius","Radius",8],["length","Span length",24]],
};
const GRIDS = {"2d":[["nx","Nx",400],["ny","Ny",200]], "3d":[["nx","Nx",96],["ny","Ny",48],["nz","Nz",48]]};
function fill(sel, items){ sel.innerHTML = items.map(v=>`<option value="${v}">${v}</option>`).join(""); }
function inputs(host, defs){
  host.innerHTML = defs.map(([id,lab,val]) =>
    `<div><label for="${id}">${lab}</label><input id="${id}" type="number" value="${val}" step="1" min="1"></div>`).join("");
}
function syncShape(){
  const mode = $("#mode").value;
  fill($("#shape"), mode === "2d" ? schema.shapes_2d : schema.shapes_3d);
  $("#latticeRow").hidden = mode !== "3d";
  inputs($("#gridRow"), GRIDS[mode]);
  $("#gridRow").className = "row " + (mode === "3d" ? "three" : "");
  // A sphere's wake is steady until Re ≈ 210 and sheds only above ≈ 270, so a
  // perturbation tuned for the 2D cylinder (onset 47) just forces noise into Cd.
  $("#inlet_perturbation").value = mode === "3d" ? "0" : "0.02";
  // A 3D body is only ~a dozen cells across, which puts omega near 2, where
  // BGK goes unstable (the default sphere diverges in ~300 steps); the
  // regularized operator is stable there at the same cost.
  $("#collision").value = mode === "3d" ? "regularized" : "bgk";
  $("#pertHint").textContent = mode === "3d"
    ? "Only needed to trip shedding: a sphere's wake is steady below Re ≈ 210 and sheds above ≈ 270. Leave at 0 below that — it adds noise, not physics."
    : "A small perturbation is what trips vortex shedding above Re ≈ 47.";
  syncDims();
}
function syncDims(){ inputs($("#dimRow"), DIMS[$("#mode").value + ":" + $("#shape").value] || []); }
function params(){
  const p = {};
  document.querySelectorAll("input,select").forEach(el=>{ if(el.id) p[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  return p;
}
function attach(id){
  jobId = id; location.hash = id;
  geomLoaded = false; fieldStamp = -1; figStamp = -1; tunnel.reset();
  $("#runBtn").disabled = true; $("#stopBtn").disabled = false;
  clearInterval(poll); poll = setInterval(tick, 700); tick();
}
async function boot(){
  schema = await (await fetch("/api/schema")).json();
  fill($("#collision"), schema.collisions); fill($("#backend"), schema.backends);
  fill($("#lattice"), schema.lattices);     fill($("#wall_bc"), schema.wall_bcs);
  fill($("#outlet_bc"), schema.outlet_bcs);
  syncShape();
  $("#mode").addEventListener("change", syncShape);
  $("#shape").addEventListener("change", syncDims);
  const fromUrl = location.hash.replace(/^#/, "").trim();
  if(/^[a-f0-9]{6,32}$/.test(fromUrl) && (await fetch(`/api/status?id=${fromUrl}`)).ok) attach(fromUrl);
}
$("#runBtn").addEventListener("click", async () => {
  $("#errBox").hidden = true; $("#stats").innerHTML = ""; $("#checks").hidden = true;
  for(const k of ["speed","vorticity","pressure"]) $("#fig_"+k).innerHTML = '<span class="empty">rendering…</span>';
  formSynced = true;
  const r = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(params())});
  attach((await r.json()).id);
});
$("#stopBtn").addEventListener("click", async () => {
  if(jobId) await fetch("/api/stop", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id: jobId})});
});

// ------------------------------------------------------------- polling ----
async function fetchPacked(url){
  const r = await fetch(url); if(!r.ok) return null;
  const buf = await r.arrayBuffer(), bytes = new Uint8Array(buf);
  const nl = bytes.indexOf(10);
  const header = JSON.parse(new TextDecoder().decode(bytes.subarray(0, nl)));
  let off = nl + 1; const out = {header};
  for(const p of header.parts){
    if(p.dtype === "float32"){ out[p.name] = new Float32Array(buf, off, p.count); off += p.count * 4; }
    else { out[p.name] = new Uint8Array(buf, off, p.count); off += p.count; }
  }
  return out;
}
async function tick(){
  if(!jobId) return;
  let j; try { j = await (await fetch(`/api/status?id=${jobId}`)).json(); }
  catch(e){ console.error("status poll failed:", e); $("#statusText").textContent = "lost contact with the server — is webui.py still running?"; return; }
  if(j.error && !j.state) return;
  lastState = j.state;
  $("#dot").className = "dot " + j.state;
  $("#statusText").textContent = j.message || j.state;
  $("#elapsed").textContent = j.elapsed ? j.elapsed.toFixed(1) + " s" : "";
  $("#bar").style.width = j.total ? (100 * j.step / j.total).toFixed(1) + "%" : "0%";

  if(!formSynced && j.params){
    formSynced = true;
    $("#mode").value = j.params.mode || "2d"; syncShape();
    if(j.params.shape){ $("#shape").value = j.params.shape; syncDims(); }
    for(const [k, v] of Object.entries(j.params)){
      const el = document.getElementById(k);
      if(!el || k === "mode" || k === "shape") continue;
      if(el.type === "checkbox") el.checked = !!v; else el.value = v;
    }
  }
  const s = j.result.setup;
  if(s) $("#setupPill").textContent = `${s.label} · ${s.grid.join("×")} · ω=${s.omega} · ν=${s.nu}`
      + (s.ref_area ? ` · A=${s.ref_area}` : "") + (s.backend ? ` · ${s.backend}` : "");
  if(j.state === "error"){ $("#errBox").hidden = false; $("#errBox").textContent = j.error || "the run failed"; }

  drawChart(j.history);
  const c = j.result.coefficients;
  const f4 = v => (v === null || v === undefined) ? "—" : v.toFixed(4);
  if(c) $("#stats").innerHTML = `
    <div class="stat" title="± is the 95% statistical uncertainty of the mean, from ${c.cd_n_eff ?? "?"} effective independent samples. It does not include systematic errors such as blockage or resolution — see the checks below."><span class="k">C_d · 95% stat.</span><span class="v">${f4(c.cd)}<small> ±${f4(c.cd_sem95)}</small></span></div>
    <div class="stat" title="Standard deviation of the per-step drag signal: how much it fluctuates, not how uncertain the mean is."><span class="k">C_d fluctuation σ</span><span class="v">${f4(c.cd_std)}</span></div>
    <div class="stat"><span class="k">C_l · 95% stat.</span><span class="v">${f4(c.cl)}<small> ±${f4(c.cl_sem95)}</small></span></div>
    <div class="stat"><span class="k">Steps</span><span class="v">${j.step.toLocaleString()}</span></div>
    <div class="stat"><span class="k">Cells</span><span class="v">${(s ? s.cells : 0).toLocaleString()}</span></div>`;

  renderChecks(j.result);

  if(j.has_geometry && !geomLoaded){
    const g = await fetchPacked(`/api/geometry?id=${jobId}`);
    if(g){ tunnel.setGeometry(g); geomLoaded = true; }
  }
  if(j.field_step !== fieldStamp && j.field_step >= 0){
    const f = await fetchPacked(`/api/field?id=${jobId}`);
    if(f){ tunnel.setField(f); fieldStamp = j.field_step; }
  }
  if(j.figure_step !== figStamp && j.figure_step >= 0){
    figStamp = j.figure_step;
    for(const k of j.figures){
      const img = new Image(); img.alt = k + " field";
      img.onload = () => { const fg = $("#fig_"+k); fg.innerHTML = ""; fg.appendChild(img); };
      img.src = `/api/figure?id=${jobId}&name=${k}&t=${figStamp}`;
    }
  }
  if(["done","error","stopped"].includes(j.state)){
    clearInterval(poll); poll = null;
    $("#runBtn").disabled = false; $("#stopBtn").disabled = true;
  }
}

// -------------------------------------------------------------- checks ----
// The uncertainty budget: a statistical ± can never cover a systematic bias,
// so each systematic effect gets its own chip, and the expected value for the
// run *as configured* (confinement included) sits first.
const CHECK_ORDER = ["statistical", "blockage", "domain_length", "discretization", "bc_sensitivity", "convergence"];
function esc(t){ return String(t).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function renderChecks(res){
  const box = $("#checks"), u = res.uncertainty, r = res.reference;
  if(!u && !r){ box.hidden = true; return; }
  let html = "";
  if(r){
    const exp = r.expected != null ? `expected ≈ ${r.expected.toFixed(2)}` : "literature";
    const band = r.band ? ` [${r.band[0].toFixed(2)}–${r.band[1].toFixed(2)}]` : "";
    const un = r.unconfined != null ? ` · unconfined ${r.unconfined.toFixed(2)}` : "";
    html += `<span class="chip ref ${r.status || ""}" title="${esc(r.note || "")}"><i></i>${exp}${band}${un}</span>`;
  }
  for(const name of CHECK_ORDER){
    const c = u && u[name]; if(!c) continue;
    html += `<span class="chip ${c.status}" title="${esc(c.message)}"><i></i>${esc(c.short || name)}</span>`;
  }
  box.innerHTML = html; box.hidden = false;
}

// --------------------------------------------------------------- chart ----
function drawChart(hist){
  const svg = $("#chart");
  const W = Math.max(svg.clientWidth, 200), H = Math.max(svg.clientHeight, 120);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const L = 50, R = 12, T = 10, B = 26;
  if(!hist || hist.length < 2){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#6E7A66" font-size="12">no samples yet</text>`; return;
  }
  const xs = hist.map(d=>d.step);
  const all = hist.flatMap(d=>[d.cd, d.cl]).filter(Number.isFinite);
  let lo = Math.min(...all), hi = Math.max(...all);
  if(hi - lo < 1e-9){ hi += 0.5; lo -= 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const X = v => L + (W-L-R) * (v - xs[0]) / Math.max(xs[xs.length-1] - xs[0], 1);
  const Y = v => T + (H-T-B) * (1 - (v - lo) / (hi - lo));

  function boxDims(){
    const [nz, ny, nx] = full;
    return [nx, ny, nz > 1 ? nz : Math.max(4, 0.12 * Math.max(nx, ny))];   // a 2D run is drawn as a slab
  }
  function resize(){
    cv.width = Math.max(1, Math.round(cv.clientWidth * perf.scale));
    cv.height = Math.max(1, Math.round(cv.clientHeight * perf.scale));
    request();
  }
  function request(){ if(!queued){ queued = true; requestAnimationFrame(draw); } }
  // every 30 animated frames: below ~30 fps render smaller, above ~50 fps larger
  function pace(){
    if(++perf.frames < 30) return;
    const ms = (performance.now() - perf.since) / perf.frames, top = Math.min(window.devicePixelRatio || 1, 1.5);
    const next = ms > 34 ? Math.max(0.4, perf.scale * 0.8) : ms < 20 ? Math.min(top, perf.scale * 1.12) : perf.scale;
    perf.frames = 0; perf.since = performance.now();
    if(Math.abs(next - perf.scale) > 0.01){ perf.scale = next; resize(); }
  }

  function draw(now){
    queued = false;
    if(!gl){ draw2d(); return; }
    now = now || performance.now();
    const moving = running && qty === "smoke" && fld && fld.vel && dyeShape;
    if(moving){
      simAcc += Math.min(Math.max((now - (lastFrame || now)) / 1000, 0), 0.1);
      const per = stepSeconds();
      for(let n = 0; simAcc >= per && n < 6; n++){ advance(); simAcc -= per; }
      simAcc = Math.min(simAcc, per);
      pace(); request();
    }
    lastFrame = moving ? now : 0;

    gl.useProgram(render);
    gl.viewport(0, 0, cv.width, cv.height);
    const box = boxDims(), c = box.map(v => v / 2), tanHalf = Math.tan(20 * Math.PI / 180), aspect = cv.width / cv.height;
    const cp = Math.cos(view.pitch), dir = [cp * Math.sin(view.yaw), Math.sin(view.pitch), cp * Math.cos(view.yaw)];
    const norm = v => { const l = Math.hypot(...v) || 1; return v.map(x => x / l); };
    const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
    const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
    const fwd = dir.map(v => -v), right = norm(cross(fwd, [0, 1, 0])), up = cross(right, fwd);
    // the distance at which all eight corners fit, with a margin, then zoom
    let fit = 0;
    for(const sx of [-1, 1]) for(const sy of [-1, 1]) for(const sz of [-1, 1]){
      const o = [sx * c[0], sy * c[1], sz * c[2]], zc = dot(o, fwd);
      fit = Math.max(fit, Math.abs(dot(o, right)) / (tanHalf * aspect * 0.9) - zc, Math.abs(dot(o, up)) / (tanHalf * 0.84) - zc);
    }
    const dist = fit / view.zoom, eye = c.map((v, i) => v + dist * dir[i]);
    const q = QTY[qty], flat = full[0] <= 1;
    gl.uniform3f(R.uEye, ...eye); gl.uniform3f(R.uFwd, ...fwd); gl.uniform3f(R.uRight, ...right); gl.uniform3f(R.uUp, ...up);
    gl.uniform3f(R.uBox, ...box); gl.uniform3f(R.uCell, 1 / full[2], 1 / full[1], 1 / Math.max(full[0], 1));
    gl.uniform1f(R.uTanHalf, tanHalf); gl.uniform1f(R.uAspect, aspect); gl.uniform1f(R.uPixel, 2 * tanHalf / cv.height);
    gl.uniform1f(R.uDensity, flat ? q.density * 10 / box[2] : q.density);
    gl.uniform1f(R.uLo, q.lo || 0); gl.uniform1f(R.uHi, q.hi || 1);
    gl.uniform1i(R.uHasSolid, hasSolid ? 1 : 0); gl.uniform1i(R.uHasVol, fld ? 1 : 0);
    gl.uniform1i(R.uSmoke, qty === "smoke" && dyeShape ? 1 : 0);
    gl.uniform1f(R.uFrac, dyeShape && fld ? Math.min(simAcc / stepSeconds(), 1) : 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // Fallback: the mid-plane, coloured the same way, on a plain 2D canvas.
  // Smoke needs the GPU, so the fallback shows the speed there instead.
  function draw2d(){
    const W = cv.width, H = cv.height, bg = turbo(0);
    ctx2d.fillStyle = `rgb(${bg.join(",")})`; ctx2d.fillRect(0, 0, W, H);
    if(!fld) return;
    const [sz, sy, sx] = fld.header.shape, k = sz >> 1, img = new ImageData(sx, sy);
    const fs = fld.header.factor || 1, [gz, gy, gx] = full;
    const solidAt = (y, x) => geom && geom.solid[((Math.min(k * fs, gz - 1)) * gy + Math.min(y * fs, gy - 1)) * gx + Math.min(x * fs, gx - 1)];
    const value = qty === "smoke"
      ? i => Math.hypot(fld.vel[4 * i] - 127.5, fld.vel[4 * i + 1] - 127.5, fld.vel[4 * i + 2] - 127.5) / 127.5
      : i => fld[qty][i] / 255;
    for(let y = 0; y < sy; y++) for(let x = 0; x < sx; x++){
      const o = 4 * ((sy - 1 - y) * sx + x);
      if(solidAt(y, x)){ img.data.set([158, 160, 165, 255], o); continue; }
      const v = Math.min(1, value((k * sy + y) * sx + x)), c = turbo(v), w = qty === "smoke" ? 1 : Math.min(1, v * 2.5);
      img.data.set([bg[0] + (c[0] - bg[0]) * w, bg[1] + (c[1] - bg[1]) * w, bg[2] + (c[2] - bg[2]) * w, 255], o);
    }
    const off = document.createElement("canvas"); off.width = sx; off.height = sy; off.getContext("2d").putImageData(img, 0, 0);
    const s = Math.min(W / sx, H / sy) * 0.94;
    ctx2d.imageSmoothingEnabled = true; ctx2d.drawImage(off, (W - sx * s) / 2, (H - sy * s) / 2, sx * s, sy * s);
  }

  function legend(){
    const q = QTY[qty], sc = fld && fld.header.scales ? fld.header.scales : null;
    const scale = sc ? (qty === "smoke" ? sc.wake : sc[qty]) : null;
    $("#lgName").textContent = q.name;
    $("#lgHi").textContent = scale ? `${+(+scale).toFixed(2)} ${q.unit}` : "high";
  }
  function setGeometry(g){
    geom = g; full = g.header.shape;
    if(gl){ upload(1, texSolid, smoothMask(g.solid, full), full); hasSolid = true; }
    placeSource(g);
    if(full[0] <= 1){ view.yaw = 0; view.pitch = 0.22; }
    $("#tunnelEmpty").hidden = true; request();
  }
  function setField(f){
    fld = f; volShape = f.header.shape;
    if(!geom) full = f.header.full;
    if(gl){
      upload(0, texVol, qty === "smoke" ? f.wake : f[qty], volShape);
      if(f.vel){ gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_3D, texVel);
        gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, volShape[2], volShape[1], volShape[0], 0, gl.RGBA, gl.UNSIGNED_BYTE, f.vel); }
      if(!dyeShape || dyeShape.join() !== volShape.join()) makeDye(volShape);
    }
    legend(); $("#tunnelEmpty").hidden = true; request();
  }
  function setQuantity(name){
    if(!QTY[name] || name === qty) return;
    qty = name;
    if(fld && gl && name !== "smoke") upload(0, texVol, fld[qty], volShape);
    for(const b of document.querySelectorAll("#qtySeg .btn")) b.classList.toggle("on", b.dataset.q === qty);
    $("#animBtn").disabled = qty !== "smoke";
    legend(); request();
  }
  function reset(){
    geom = null; fld = null; hasSolid = false; full = [1, 1, 1]; dyeShape = null; simT = 0;
    if(gl){ upload(0, texVol, new Uint8Array(1), [1, 1, 1]); upload(1, texSolid, new Uint8Array(1), [1, 1, 1]); }
    $("#tunnelEmpty").hidden = false; request();
  }
  function resetView(){ view.yaw = full[0] <= 1 ? 0 : -0.52; view.pitch = full[0] <= 1 ? 0.22 : 0.34; view.zoom = 1; request(); }

  new ResizeObserver(resize).observe(cv); resize();
  let dragAt = null;
  cv.addEventListener("pointerdown", e => { dragAt = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointerup", () => { dragAt = null; });
  cv.addEventListener("pointermove", e => { if(!dragAt) return;
    view.yaw -= (e.clientX - dragAt[0]) * 0.008;
    view.pitch = Math.min(1.45, Math.max(-1.45, view.pitch + (e.clientY - dragAt[1]) * 0.008));
    dragAt = [e.clientX, e.clientY]; request(); });
  cv.addEventListener("wheel", e => { e.preventDefault();
    view.zoom = Math.min(6, Math.max(0.4, view.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); request(); }, {passive: false});
  for(const b of document.querySelectorAll("#qtySeg .btn")) b.addEventListener("click", () => setQuantity(b.dataset.q));
  $("#resetBtn").addEventListener("click", resetView);
  $("#animBtn").addEventListener("click", () => {
    running = !running; $("#animBtn").textContent = running ? "Pause" : "Play"; request();
  });
  $("#lgBar").style.background = `linear-gradient(90deg, ${TURBO.map(c => `rgb(${c.join(",")})`).join(",")})`;
  if(!gl){
    document.querySelector(".viewer .legend .hint").textContent = "mid-plane slice · the 3D view needs WebGL2";
    $("#animBtn").hidden = true;
  }
  legend();
  return {setGeometry, setField, reset, setQuantity};
})();

boot();
drawChart([]);
</script>
</body>
</html>
