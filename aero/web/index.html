<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aero CFD</title>
<style>
:root{
  color-scheme: light;
  --ground:#F3EDDC; --surface:#FDFBF2; --panel:#F9F5EA; --sunk:#E8E1CC;
  --ink:#1F2D21; --muted:#55634F; --faint:#6E7A66;
  --accent:#15803D; --accent-deep:#14653A; --accent-soft:#DFEFE3;
  --line:#CBBF9E; --line-soft:#DED5BC;
  --warn:#8A5A0B; --error:#B3261E;
  --cd:#127A38; --cl:#5B21B6;
  --tunnel:#0E1710;
  --top:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:16px}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
button{font:inherit;cursor:pointer}

.topbar{
  height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.topbar .sp{flex:1 1 auto}
.pill{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:20px;padding:3px 11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 14px;font-weight:550}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-deep)}
.btn.danger{color:var(--error)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:500}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100% - var(--top))}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 16px 20px;overflow-y:auto}
.main{display:grid;grid-template-rows:auto minmax(0,1.35fr) minmax(0,1fr);gap:10px;padding:10px 14px 12px;min-height:0}

fieldset{border:none;margin:0 0 12px;padding:0}
fieldset h2{margin-bottom:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.one{grid-template-columns:1fr}
label{display:block;font-size:11px;color:var(--faint);margin-bottom:2px;letter-spacing:.02em}
input,select{width:100%;font:inherit;font-size:13px;padding:5px 8px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:7px}
.check input{width:auto}
.hint{font-size:11.5px;color:var(--faint);margin:2px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;min-height:0;display:flex;flex-direction:column}
.card h2{margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.toprow{display:flex;flex-direction:row;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 14px}
.status{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);min-width:0;flex:1 1 260px}
.status span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.running{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.dot.done{background:var(--accent)} .dot.error{background:var(--error)} .dot.stopped{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.running{animation:none}}
.bar{height:4px;background:var(--sunk);border-radius:3px;overflow:hidden;flex:0 0 100%;margin-top:-2px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.stat .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:400;color:var(--muted)}
.err{background:#FBEAE8;border:1px solid #E4B9B4;color:var(--error);border-radius:6px;padding:6px 10px;font-size:13px;flex:0 0 100%}

.midrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;min-height:0}
.botrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
.fill{flex:1;min-height:0;position:relative}
.viewer{background:var(--tunnel);border-radius:7px;overflow:hidden;position:relative}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.viewer .legend{position:absolute;left:10px;bottom:8px;font-size:11px;color:#9fb3a3;display:flex;align-items:center;gap:8px;pointer-events:none}
.viewer .legend i{display:inline-block;width:64px;height:6px;border-radius:3px;
  background:linear-gradient(90deg,#3b1d6e,#2a6f8f,#2fb47c,#e8e04a)}
.viewer .empty{position:absolute;inset:0;display:grid;place-items:center;color:#6f8474;font-size:13px;pointer-events:none}
svg.chart{display:block;width:100%;height:100%}
figure{margin:0;flex:1;min-height:0;background:#fff;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden;display:grid;place-items:center}
figure img{width:100%;height:100%;object-fit:contain;display:block}
figure .empty{color:var(--faint);font-size:12.5px}
@media (max-width:900px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;height:auto}
  .main{grid-template-rows:auto 520px 300px}
  .midrow{grid-template-columns:1fr}
  .botrow{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Aero CFD</h1>
  <span class="pill mono" id="setupPill">no run yet</span>
  <span class="sp"></span>
  <button class="btn primary" id="runBtn">Run</button>
  <button class="btn danger" id="stopBtn" disabled>Stop</button>
</div>

<div class="layout">
  <aside class="side">
    <fieldset>
      <h2>Case</h2>
      <div class="row">
        <div><label for="mode">Mode</label>
          <select id="mode"><option value="2d">2D</option><option value="3d">3D</option></select></div>
        <div><label for="shape">Shape</label><select id="shape"></select></div>
      </div>
      <div class="row" id="dimRow"></div>
      <div class="row">
        <div><label for="re">Reynolds number</label><input id="re" type="number" value="100" min="0.1" step="10"></div>
        <div><label for="u0">Inlet u₀</label><input id="u0" type="number" value="0.05" min="0.001" max="0.2" step="0.01"></div>
      </div>
      <div class="row three" id="gridRow"></div>
      <div class="row one">
        <div><label for="steps">Steps</label><input id="steps" type="number" value="3000" min="50" step="500"></div>
      </div>
    </fieldset>
    <fieldset>
      <h2>Solver</h2>
      <div class="row">
        <div><label for="collision">Collision</label><select id="collision"></select></div>
        <div><label for="backend">Backend</label><select id="backend"></select></div>
      </div>
      <div class="row" id="latticeRow" hidden>
        <div><label for="lattice">Lattice</label><select id="lattice"></select></div><div></div>
      </div>
      <div class="row">
        <div><label for="wall_bc">Wall BC</label><select id="wall_bc"></select></div>
        <div><label for="outlet_bc">Outlet BC</label><select id="outlet_bc"></select></div>
      </div>
      <div class="check"><input type="checkbox" id="les"><label for="les" style="margin:0">Smagorinsky LES</label></div>
      <div class="row one">
        <div><label for="inlet_perturbation">Inlet perturbation (fraction of u₀)</label>
          <input id="inlet_perturbation" type="number" value="0.02" min="0" max="0.5" step="0.01"></div>
      </div>
      <p class="hint">A small perturbation is what trips vortex shedding above Re ≈ 47.</p>
    </fieldset>
  </aside>

  <main class="main">
    <div class="card toprow">
      <div class="status"><span class="dot" id="dot"></span><span class="t" id="statusText">Set a case and press Run.</span></div>
      <div class="stats" id="stats"></div>
      <span class="mono" id="elapsed" style="font-size:12px;color:var(--muted)"></span>
      <div class="bar"><i id="bar"></i></div>
      <div id="errBox" hidden class="err"></div>
    </div>

    <div class="midrow">
      <div class="card">
        <h2>Wind tunnel <span class="sp"></span>
          <button class="btn sm" id="pauseBtn">Pause</button>
          <button class="btn sm" id="resetBtn">Reset view</button></h2>
        <div class="fill viewer">
          <canvas id="tunnel"></canvas>
          <div class="empty" id="tunnelEmpty">Streamlets appear once a run starts</div>
          <div class="legend"><span>slow</span><i></i><span>fast</span><span style="margin-left:10px">drag to rotate · wheel to zoom</span></div>
        </div>
      </div>
      <div class="card">
        <h2>Convergence <span class="sp"></span>
          <span style="font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0">
            <i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cd);vertical-align:-1px"></i> C<sub>d</sub>&nbsp;&nbsp;
            <i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cl);vertical-align:-1px"></i> C<sub>l</sub></span></h2>
        <div class="fill"><svg class="chart" id="chart" role="img" aria-label="Drag and lift coefficient against step"></svg></div>
      </div>
    </div>

    <div class="botrow">
      <div class="card"><h2>Velocity</h2><figure id="fig_speed"><span class="empty">—</span></figure></div>
      <div class="card"><h2>Vorticity</h2><figure id="fig_vorticity"><span class="empty">—</span></figure></div>
      <div class="card"><h2>Pressure</h2><figure id="fig_pressure"><span class="empty">—</span></figure></div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let schema = null, jobId = null, poll = null;
let lastState = "", figStamp = -1, fieldStamp = -1, formSynced = false, geomLoaded = false;

// ---------------------------------------------------------------- form ----
const DIMS = {
  "2d:cylinder":  [["radius","Radius",20]],
  "2d:rectangle": [["width","Width",40],["height","Height",20]],
  "3d:sphere":    [["radius","Radius",7]],
  "3d:box":       [["width","Width",10],["height","Height",10],["depth","Depth",10]],
  "3d:cylinder":  [["radius","Radius",8],["length","Span length",24]],
};
const GRIDS = {"2d":[["nx","Nx",400],["ny","Ny",200]], "3d":[["nx","Nx",96],["ny","Ny",48],["nz","Nz",48]]};
function fill(sel, items){ sel.innerHTML = items.map(v=>`<option value="${v}">${v}</option>`).join(""); }
function inputs(host, defs){
  host.innerHTML = defs.map(([id,lab,val]) =>
    `<div><label for="${id}">${lab}</label><input id="${id}" type="number" value="${val}" step="1" min="1"></div>`).join("");
}
function syncShape(){
  const mode = $("#mode").value;
  fill($("#shape"), mode === "2d" ? schema.shapes_2d : schema.shapes_3d);
  $("#latticeRow").hidden = mode !== "3d";
  inputs($("#gridRow"), GRIDS[mode]);
  $("#gridRow").className = "row " + (mode === "3d" ? "three" : "");
  syncDims();
}
function syncDims(){ inputs($("#dimRow"), DIMS[$("#mode").value + ":" + $("#shape").value] || []); }
function params(){
  const p = {};
  document.querySelectorAll("input,select").forEach(el=>{ if(el.id) p[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  return p;
}
function attach(id){
  jobId = id; location.hash = id;
  geomLoaded = false; fieldStamp = -1; figStamp = -1; tunnel.reset();
  $("#runBtn").disabled = true; $("#stopBtn").disabled = false;
  clearInterval(poll); poll = setInterval(tick, 700); tick();
}
async function boot(){
  schema = await (await fetch("/api/schema")).json();
  fill($("#collision"), schema.collisions); fill($("#backend"), schema.backends);
  fill($("#lattice"), schema.lattices);     fill($("#wall_bc"), schema.wall_bcs);
  fill($("#outlet_bc"), schema.outlet_bcs);
  syncShape();
  $("#mode").addEventListener("change", syncShape);
  $("#shape").addEventListener("change", syncDims);
  const fromUrl = location.hash.replace(/^#/, "").trim();
  if(/^[a-f0-9]{6,32}$/.test(fromUrl) && (await fetch(`/api/status?id=${fromUrl}`)).ok) attach(fromUrl);
}
$("#runBtn").addEventListener("click", async () => {
  $("#errBox").hidden = true; $("#stats").innerHTML = "";
  for(const k of ["speed","vorticity","pressure"]) $("#fig_"+k).innerHTML = '<span class="empty">rendering…</span>';
  formSynced = true;
  const r = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(params())});
  attach((await r.json()).id);
});
$("#stopBtn").addEventListener("click", async () => {
  if(jobId) await fetch("/api/stop", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id: jobId})});
});

// ------------------------------------------------------------- polling ----
async function fetchPacked(url){
  const r = await fetch(url); if(!r.ok) return null;
  const buf = await r.arrayBuffer(), bytes = new Uint8Array(buf);
  const nl = bytes.indexOf(10);
  const header = JSON.parse(new TextDecoder().decode(bytes.subarray(0, nl)));
  let off = nl + 1; const out = {header};
  for(const p of header.parts){
    if(p.dtype === "float32"){ out[p.name] = new Float32Array(buf, off, p.count); off += p.count * 4; }
    else { out[p.name] = new Uint8Array(buf, off, p.count); off += p.count; }
  }
  return out;
}
async function tick(){
  if(!jobId) return;
  let j; try { j = await (await fetch(`/api/status?id=${jobId}`)).json(); }
  catch(e){ console.error("status poll failed:", e); $("#statusText").textContent = "lost contact with the server — is webui.py still running?"; return; }
  if(j.error && !j.state) return;
  lastState = j.state;
  $("#dot").className = "dot " + j.state;
  $("#statusText").textContent = j.message || j.state;
  $("#elapsed").textContent = j.elapsed ? j.elapsed.toFixed(1) + " s" : "";
  $("#bar").style.width = j.total ? (100 * j.step / j.total).toFixed(1) + "%" : "0%";

  if(!formSynced && j.params){
    formSynced = true;
    $("#mode").value = j.params.mode || "2d"; syncShape();
    if(j.params.shape){ $("#shape").value = j.params.shape; syncDims(); }
    for(const [k, v] of Object.entries(j.params)){
      const el = document.getElementById(k);
      if(!el || k === "mode" || k === "shape") continue;
      if(el.type === "checkbox") el.checked = !!v; else el.value = v;
    }
  }
  const s = j.result.setup;
  if(s) $("#setupPill").textContent = `${s.label} · ${s.grid.join("×")} · ω=${s.omega} · ν=${s.nu}`
      + (s.ref_area ? ` · A=${s.ref_area}` : "") + (s.backend ? ` · ${s.backend}` : "");
  if(j.state === "error"){ $("#errBox").hidden = false; $("#errBox").textContent = j.error || "the run failed"; }

  drawChart(j.history);
  const c = j.result.coefficients;
  const f4 = v => (v === null || v === undefined) ? "—" : v.toFixed(4);
  if(c) $("#stats").innerHTML = `
    <div class="stat"><span class="k">C_d</span><span class="v">${f4(c.cd)}<small> ±${f4(c.cd_std)}</small></span></div>
    <div class="stat"><span class="k">C_l</span><span class="v">${f4(c.cl)}<small> ±${f4(c.cl_std)}</small></span></div>
    <div class="stat"><span class="k">Steps</span><span class="v">${j.step.toLocaleString()}</span></div>
    <div class="stat"><span class="k">Cells</span><span class="v">${(s ? s.cells : 0).toLocaleString()}</span></div>`;

  if(j.has_geometry && !geomLoaded){
    const g = await fetchPacked(`/api/geometry?id=${jobId}`);
    if(g){ tunnel.setGeometry(g); geomLoaded = true; }
  }
  if(j.field_step !== fieldStamp && j.field_step >= 0){
    const f = await fetchPacked(`/api/field?id=${jobId}`);
    if(f){ tunnel.setField(f); fieldStamp = j.field_step; }
  }
  if(j.figure_step !== figStamp && j.figure_step >= 0){
    figStamp = j.figure_step;
    for(const k of j.figures){
      const img = new Image(); img.alt = k + " field";
      img.onload = () => { const fg = $("#fig_"+k); fg.innerHTML = ""; fg.appendChild(img); };
      img.src = `/api/figure?id=${jobId}&name=${k}&t=${figStamp}`;
    }
  }
  if(["done","error","stopped"].includes(j.state)){
    clearInterval(poll); poll = null;
    $("#runBtn").disabled = false; $("#stopBtn").disabled = true;
  }
}

// --------------------------------------------------------------- chart ----
function drawChart(hist){
  const svg = $("#chart");
  const W = Math.max(svg.clientWidth, 200), H = Math.max(svg.clientHeight, 120);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const L = 50, R = 12, T = 10, B = 26;
  if(!hist || hist.length < 2){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#6E7A66" font-size="12">no samples yet</text>`; return;
  }
  const xs = hist.map(d=>d.step);
  const all = hist.flatMap(d=>[d.cd, d.cl]).filter(Number.isFinite);
  let lo = Math.min(...all), hi = Math.max(...all);
  if(hi - lo < 1e-9){ hi += 0.5; lo -= 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const X = v => L + (W-L-R) * (v - xs[0]) / Math.max(xs[xs.length-1] - xs[0], 1);
  const Y = v => T + (H-T-B) * (1 - (v - lo) / (hi - lo));
  const path = k => hist.filter(d=>Number.isFinite(d[k])).map((d,i)=>`${i?"L":"M"}${X(d.step).toFixed(1)} ${Y(d[k]).toFixed(1)}`).join(" ");
  let g = "";
  for(let i=0;i<=4;i++){ const v = lo + (hi-lo)*i/4, y = Y(v);
    g += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="#DED5BC"/>`
       + `<text x="${L-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#6E7A66" font-family="ui-monospace,monospace">${v.toFixed(2)}</text>`; }
  for(let i=0;i<=3;i++){ const v = xs[0] + (xs[xs.length-1]-xs[0])*i/3;
    g += `<text x="${X(v).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6E7A66" font-family="ui-monospace,monospace">${Math.round(v).toLocaleString()}</text>`; }
  svg.innerHTML = g + `<path d="${path("cl")}" fill="none" stroke="#5B21B6" stroke-width="1.5"/>`
                    + `<path d="${path("cd")}" fill="none" stroke="#127A38" stroke-width="2"/>`;
}
let lastHist = [];
new ResizeObserver(() => drawChart(lastHist)).observe($("#chart"));
const _drawChart = drawChart; drawChart = h => { lastHist = h || []; _drawChart(lastHist); };

// ------------------------------------------------------------ 3D tunnel ----
// Dependency-free: a perspective projection onto a 2D canvas.  The body is
// drawn from its surface voxels, shaded by a crude normal; streamlets are
// particles advected through the (trilinearly interpolated) velocity field,
// seeded at the inlet, drawn as fading trails coloured by speed.
const tunnel = (() => {
  const cv = $("#tunnel"), ctx = cv.getContext("2d");
  const view = {yaw:-0.62, pitch:0.36, zoom:1, paused:false};
  let geom = null, fld = null, surf = [], parts = [], full = [1,1,1], dpr = 1, W = 0, H = 0;
  const N_TRAIL = 16;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  }
  new ResizeObserver(resize).observe(cv); resize();

  function setGeometry(g){
    geom = g; full = g.header.shape;                 // [nz, ny, nx]
    const [nz, ny, nx] = full, S = g.solid, idx = (z,y,x) => (z*ny + y)*nx + x;
    surf = [];
    for(let z=0; z<nz; z++) for(let y=0; y<ny; y++) for(let x=0; x<nx; x++){
      if(!S[idx(z,y,x)]) continue;
      let nX=0, nY=0, nZ=0, open=false;
      const chk = (dz,dy,dx) => { const zz=z+dz, yy=y+dy, xx=x+dx;
        if(nz>1 && (zz<0||zz>=nz)) return; if(yy<0||yy>=ny||xx<0||xx>=nx) return;
        if(!S[idx(zz,yy,xx)]){ open=true; nX+=dx; nY+=dy; nZ+=dz; } };
      chk(0,0,1); chk(0,0,-1); chk(0,1,0); chk(0,-1,0); if(nz>1){ chk(1,0,0); chk(-1,0,0); }
      if(open){ const l = Math.hypot(nX,nY,nZ)||1; surf.push([x+.5, y+.5, z+.5, nX/l, nY/l, nZ/l]); }
    }
    if(nz === 1){ view.yaw = -0.25; view.pitch = 0.55; }
    $("#tunnelEmpty").hidden = true;
    if(parts.length === 0) seedAll();
  }
  function setField(f){ fld = f; }
  function reset(){ geom = null; fld = null; surf = []; parts = []; $("#tunnelEmpty").hidden = false; }
  function resetView(){ view.yaw = full[0] === 1 ? -0.25 : -0.62; view.pitch = full[0] === 1 ? 0.55 : 0.36; view.zoom = 1; }

  function solidAt(x,y,z){
    const [nz,ny,nx] = full; const xi=x|0, yi=y|0, zi=nz>1 ? (z|0) : 0;
    if(xi<0||yi<0||xi>=nx||yi>=ny||(nz>1&&(zi<0||zi>=nz))) return true;
    return !!geom.solid[(zi*ny+yi)*nx+xi];
  }
  function sampleU(x,y,z){
    if(!fld) return [0,0,0];
    const [sz,sy,sx] = fld.header.shape, f = fld.header.factor;
    let gx = x/f, gy = y/f, gz = sz>1 ? z/f : 0;
    gx = Math.min(Math.max(gx,0), sx-1.001); gy = Math.min(Math.max(gy,0), sy-1.001); gz = Math.min(Math.max(gz,0), Math.max(sz-1.001,0));
    const x0=gx|0, y0=gy|0, z0=gz|0, tx=gx-x0, ty=gy-y0, tz=gz-z0;
    const x1=Math.min(x0+1,sx-1), y1=Math.min(y0+1,sy-1), z1=Math.min(z0+1,sz-1);
    const I = (z,y,x) => (z*sy+y)*sx+x;
    const lerp = (a,b,t) => a+(b-a)*t;
    const tri = A => {
      const c00=lerp(A[I(z0,y0,x0)],A[I(z0,y0,x1)],tx), c10=lerp(A[I(z0,y1,x0)],A[I(z0,y1,x1)],tx);
      const c01=lerp(A[I(z1,y0,x0)],A[I(z1,y0,x1)],tx), c11=lerp(A[I(z1,y1,x0)],A[I(z1,y1,x1)],tx);
      return lerp(lerp(c00,c10,ty), lerp(c01,c11,ty), tz);
    };
    return [tri(fld.ux), tri(fld.uy), tri(fld.uz)];
  }
  function seed(p){
    const [nz,ny,nx] = full;
    for(let k=0;k<12;k++){
      const x = 0.5 + Math.random()*2.5, y = 0.5 + Math.random()*(ny-1), z = nz>1 ? 0.5 + Math.random()*(nz-1) : 0.5;
      if(!solidAt(x,y,z)){ p.x=x; p.y=y; p.z=z; break; }
    }
    p.age = 0; p.life = 260 + Math.random()*200; p.stuck = 0; p.trail = [];
    p.pre = Math.floor(Math.random()*40);         // stagger births so they don't march in a wall
  }
  function seedAll(){
    const n = full[0] > 1 ? 700 : 420;
    parts = Array.from({length:n}, () => { const p = {}; seed(p); p.pre = Math.floor(Math.random()*600); return p; });
  }
  function advance(){
    if(!fld || !geom) return;
    const [nz,ny,nx] = full, umax = fld.header.umax || 1e-9;
    const dt = (nx / 240) / umax;                 // a full traverse in ~4 s at 60 fps
    for(const p of parts){
      if(p.pre > 0){ p.pre--; continue; }
      const [ux,uy,uz] = sampleU(p.x,p.y,p.z);
      const sp = Math.hypot(ux,uy,uz);
      p.x += ux*dt; p.y += uy*dt; if(nz>1) p.z += uz*dt;
      p.age++; p.stuck = sp < umax*0.02 ? p.stuck+1 : 0;
      p.trail.push([p.x,p.y,p.z,sp/umax]); if(p.trail.length > N_TRAIL) p.trail.shift();
      if(p.x >= nx-1 || p.x < 0 || p.y < 0 || p.y >= ny || (nz>1 && (p.z<0||p.z>=nz)) || solidAt(p.x,p.y,p.z) || p.age > p.life || p.stuck > 40) seed(p);
    }
  }
  // viridis-ish ramp: purple -> teal -> green -> yellow
  const RAMP = [[59,29,110],[42,111,143],[47,180,124],[232,224,74]];
  function ramp(t){
    t = Math.min(Math.max(t,0),1) * (RAMP.length-1); const i = Math.min(t|0, RAMP.length-2), u = t-i;
    const a = RAMP[i], b = RAMP[i+1]; return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u];
  }
  function project(x,y,z){
    const [nz,ny,nx] = full;
    const px = x-nx/2, py = y-ny/2, pz = z-nz/2;
    const cy=Math.cos(view.yaw), sy=Math.sin(view.yaw), cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
    const X = px*cy - pz*sy, Zr = px*sy + pz*cy;
    const Y = py*cp - Zr*sp, Z = py*sp + Zr*cp;
    const Dd = Math.max(nx,ny,nz)*2.4;
    const per = Dd/(Dd - Z), s = Math.min(W/nx, H/Math.max(ny, nz*0.9))*0.78*view.zoom;
    return [W/2 + X*per*s, H/2 - Y*per*s, Z, per*s];
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#0E1710"; ctx.fillRect(0,0,W,H);
    if(!geom){ requestAnimationFrame(draw); return; }
    const [nz,ny,nx] = full;
    // tunnel edges
    const C = [[0,0,0],[nx,0,0],[nx,ny,0],[0,ny,0],[0,0,nz],[nx,0,nz],[nx,ny,nz],[0,ny,nz]].map(c=>project(...c));
    const E = nz>1 ? [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]] : [[0,1],[1,2],[2,3],[3,0]];
    ctx.strokeStyle = "rgba(160,190,168,0.28)"; ctx.lineWidth = 1;
    ctx.beginPath(); for(const [a,b] of E){ ctx.moveTo(C[a][0],C[a][1]); ctx.lineTo(C[b][0],C[b][1]); } ctx.stroke();
    // inlet arrow hint
    const i0 = project(0, ny/2, nz/2), i1 = project(Math.max(nx*0.06,3), ny/2, nz/2);
    ctx.strokeStyle = "rgba(160,190,168,0.5)"; ctx.beginPath(); ctx.moveTo(i0[0],i0[1]); ctx.lineTo(i1[0],i1[1]); ctx.stroke();

    // body: depth-sorted surface voxels with a simple headlight shade
    const bodyPts = surf.map(v => { const q = project(v[0],v[1],v[2]); return [q[0],q[1],q[2],q[3],v[3],v[4],v[5]]; });
    bodyPts.sort((a,b)=>b[2]-a[2]);
    const bodyDepth = bodyPts.length ? bodyPts[bodyPts.length>>1][2] : 0;
    const cy=Math.cos(view.yaw), sy=Math.sin(view.yaw), cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
    const trails = [];
    for(const p of parts){ if(p.trail.length > 1){ const h = p.trail[p.trail.length-1]; trails.push([p, project(h[0],h[1],h[2])[2]]); } }
    const drawTrails = behind => {
      ctx.lineCap = "round";
      for(const [p, d] of trails){
        if(behind ? d <= bodyDepth : d > bodyDepth) continue;
        const fade = p.age > p.life-40 ? (p.life-p.age)/40 : 1;
        const n = p.trail.length;
        for(let i=1;i<n;i++){
          const a = project(p.trail[i-1][0],p.trail[i-1][1],p.trail[i-1][2]), b = project(p.trail[i][0],p.trail[i][1],p.trail[i][2]);
          const c = ramp(p.trail[i][3]); const al = (i/n)*0.85*fade;
          ctx.strokeStyle = `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${al.toFixed(3)})`;
          ctx.lineWidth = 0.8 + 1.4*(i/n) * Math.min(b[3]/2, 1.6);
          ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
        }
      }
    };
    drawTrails(true);
    for(const q of bodyPts){
      // normal in view space, lit from the camera
      const nX = q[4]*cy - q[6]*sy, nZr = q[4]*sy + q[6]*cy, nY = q[5]*cp - nZr*sp, nZ = q[5]*sp + nZr*cp;
      const lit = Math.max(0, -nZ)*0.75 + Math.max(0,nY)*0.25 + 0.18;
      const r = Math.max(1.2, q[3]*0.62);
      ctx.fillStyle = `rgb(${(40+120*lit)|0},${(90+140*lit)|0},${(60+110*lit)|0})`;
      ctx.beginPath(); ctx.arc(q[0],q[1],r,0,6.283); ctx.fill();
    }
    drawTrails(false);
    if(!view.paused) advance();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // interaction
  let drag = null;
  cv.addEventListener("mousedown", e => { drag = [e.clientX, e.clientY]; });
  window.addEventListener("mouseup", () => { drag = null; });
  window.addEventListener("mousemove", e => { if(!drag) return;
    view.yaw += (e.clientX-drag[0])*0.008; view.pitch = Math.min(1.4, Math.max(-1.4, view.pitch + (e.clientY-drag[1])*0.008)); drag = [e.clientX,e.clientY]; });
  cv.addEventListener("wheel", e => { e.preventDefault(); view.zoom = Math.min(4, Math.max(0.4, view.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); }, {passive:false});
  $("#pauseBtn").addEventListener("click", () => { view.paused = !view.paused; $("#pauseBtn").textContent = view.paused ? "Play" : "Pause"; });
  $("#resetBtn").addEventListener("click", resetView);
  return {setGeometry, setField, reset};
})();

boot();
drawChart([]);
</script>
</body>
